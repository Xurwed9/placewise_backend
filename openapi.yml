      - Admin - Imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                category:
                  type: string
                source:
                  type: string
                dry_run:
                  type: boolean
              required:
              - file
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '413':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
