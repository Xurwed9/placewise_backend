  /api/v1/admin/claims/:
    get:
      operationId: admin_claim_list
      summary: Рӯйхати дархостҳои тасдиқи соҳиби ҷой
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: status
