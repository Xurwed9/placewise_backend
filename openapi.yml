openapi: 3.0.3
info:
  title: Placewise Душанбе API
  version: 1.0.0
  description: |2

    Placewise — API-и феҳристи ҷойҳои Душанбе.

    **Тартиби гурӯҳҳо дар Swagger:**

    1. **Public API** — Authentication, Profile, Categories, Places,
       Search & Home, Reviews, Favorites, Claims, Notifications, Uploads.
    2. **Owner API** — Owner - Places, Owner - Photos, Owner - Reviews.
    3. **Admin API** — Admin - Authentication, Admin - Users, Admin - Categories,
       Admin - Places, Admin - Claims, Admin - Reviews, Admin - Reports,
       Admin - Imports.

    Ҳар endpoint дорои тавсифи кӯтоҳ ва гурӯҳи муайян аст. Барои зуд ёфтани
    API қуттии ҷустуҷӯ дар болои саҳифаро истифода баред.
paths:
  /api/v1/admin/categories/:
    get:
      operationId: admin_category_list
      summary: Рӯйхати категорияҳо (админ)
      tags:
      - Admin - Categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCategory'
          description: ''
    post:
      operationId: admin_category_create
      summary: Сохтани категория
      tags:
      - Admin - Categories
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
          description: ''
  /api/v1/admin/categories/{category_id}/:
    get:
      operationId: admin_category_detail
      summary: Маълумоти категория (админ)
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Admin - Categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
          description: ''
    patch:
      operationId: admin_category_update
      summary: Таҳрири категория
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Admin - Categories
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
